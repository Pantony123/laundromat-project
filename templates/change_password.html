{% extends "base.html" %}
{% block title %}Change Password - FreshSpin{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-100 mb-4">
                <svg class="w-8 h-8 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Change Password</h1>
            <p class="text-gray-500 mt-1">Update your password</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-danger-50 border border-danger-200 rounded-xl text-danger-600 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/admin/password" class="space-y-5">
            <div>
                <label for="current_password" class="block text-sm font-medium text-gray-700 mb-1.5">Current Password</label>
                <input type="password"
                       id="current_password"
                       name="current_password"
                       required
                       autocomplete="current-password"
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-shadow"
                       placeholder="Enter current password">
            </div>

            <div>
                <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
                <input type="password"
                       id="new_password"
                       name="new_password"
                       required
                       autocomplete="new-password"
                       minlength="8"
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-shadow"
                       placeholder="Enter new password (min 8 characters)">
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm New Password</label>
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       required
                       autocomplete="new-password"
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-shadow"
                       placeholder="Confirm new password">
            </div>

            <button type="submit"
                    class="w-full py-3 bg-primary-600 text-white font-medium rounded-xl hover:bg-primary-700 focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors">
                Change Password
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/admin" class="text-sm text-primary-600 hover:underline">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
